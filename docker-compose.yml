services:
  web:
    build: .
    ports:
      # 8000–8004 belong to other sites on this machine (8004 is montazeri-ir).
      # This site answers on 8005.
      - "8005:8000"
    env_file:
      - .env
    volumes:
      # The whole persistent world of this app is one directory.
      - ./data:/app/data
    restart: unless-stopped
